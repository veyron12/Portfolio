<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8" />
<title>STHIRAI Prototype · Harshal Rathod</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: a framed phone centred under a slim toolbar; the app inside keeps its own light design */
:root{
  --page:#E4E6EC; --page-fg:#121214; --page-muted:#5C5E68; --chrome:#FFFFFF; --chrome-line:#D5D8E0; --bezel:#121214;
  --bg:#F4F4F5; --card:#FFFFFF; --ink:#121214; --muted:#6B6B73; --line:#EEEEF1; --soft:#E9E9EC; --img:#E6E8EC;
  --blue:#175CFF; --blue-soft:#EEF3FF; --green:#1E9E5A; --green-ink:#1A7F4B; --amber:#E5793B; --amber-soft:#FFF1E8; --amber-ink:#8E3F12; --dark:#212124; --scrim:rgba(18,18,20,.5);
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1); --soft-spring:cubic-bezier(.25,1.2,.4,1);
  --f:"Urbanist", "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#0E0F13; --page-fg:#F1F2F5; --page-muted:#A3A6B0; --chrome:#1A1C22; --chrome-line:#2B2E36; --bezel:#2A2C33; color-scheme:dark } }
:root[data-theme="dark"]{ --page:#0E0F13; --page-fg:#F1F2F5; --page-muted:#A3A6B0; --chrome:#1A1C22; --chrome-line:#2B2E36; --bezel:#2A2C33; color-scheme:dark }
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--page-fg);font-family:var(--f);overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;width:100%;max-width:640px}
.bar .brand{font-weight:800;letter-spacing:.24em;font-size:12px;margin-right:auto}
.bar .brand span{color:var(--page-muted);font-weight:600;letter-spacing:.04em;margin-left:6px}
.bar .cs{font-size:14px;font-weight:600;color:var(--page-fg);text-decoration:none;height:36px;display:inline-flex;align-items:center;padding:0 6px}
.bar select,.bar button{font-family:var(--f);font-size:14px;font-weight:600;height:36px;border-radius:18px;border:1px solid var(--chrome-line);background:var(--chrome);color:var(--page-fg);padding:0 14px;cursor:pointer}
.bar button:focus-visible,.bar select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.fit{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:flex-start}
.scaler{position:relative;flex:none}
.device{position:absolute;left:0;top:0;width:390px;height:844px;padding:10px;border-radius:56px;background:var(--bezel);transform-origin:0 0;box-shadow:0 30px 60px rgba(0,0,0,.18)}
.screenwrap{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;overflow:clip;background:var(--bg);font-family:var(--f);color:var(--ink);letter-spacing:-.02em;isolation:isolate}
.stage{position:absolute;inset:0;overflow:hidden;overflow:clip}

/* screens */
.screen{position:absolute;inset:0;background:var(--bg);padding:56px 24px 30px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:none;will-change:transform}
.screen::-webkit-scrollbar{display:none}
.screen.tabbed{padding-bottom:118px}
.screen.dark{background:#121214;color:#fff}
.in-push{animation:inPush .52s var(--ease) both;z-index:2;box-shadow:-20px 0 40px rgba(0,0,0,.08)}
.out-push{animation:outPush .52s var(--ease) both}
.in-pop{animation:inPop .52s var(--ease) both}
.out-pop{animation:outPop .52s var(--ease) both;z-index:2}
.in-fade,.in-tab{animation:inFade .45s var(--ease) both;z-index:2}
.out-fade,.out-tab{animation:outFade .3s ease both}
@keyframes inPush{from{transform:translateX(100%)}to{transform:none}}
@keyframes outPush{to{transform:translateX(-24%);filter:brightness(.9)}}
@keyframes inPop{from{transform:translateX(-24%);filter:brightness(.9)}to{transform:none;filter:none}}
@keyframes outPop{to{transform:translateX(100%)}}
@keyframes inFade{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
@keyframes outFade{to{opacity:0}}

.screen.anim .st{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms + 110ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

/* modal */
.screen.modal{background:transparent;padding:0;overflow:hidden}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fadeIn .35s ease both}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;padding:26px 22px 22px;border-radius:38px;background:var(--card);display:flex;flex-direction:column;gap:14px;animation:sheetUp .55s var(--soft-spring) both}
.sheet .grab{align-self:center;width:40px;height:5px;border-radius:3px;background:#DADADF}
.modal-out .scrim{animation:fadeOut .3s ease both}
.modal-out .sheet{animation:sheetDown .35s var(--ease) both}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(110%)}}
@keyframes sheetDown{to{transform:translateY(110%)}}

/* type */
.h{margin:6px 0 0;font-size:34px;line-height:1.08;font-weight:300;text-wrap:balance}
.h b{font-weight:700}
.p{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}
.small{font-size:13px;line-height:1.4;color:var(--muted);margin:0}
.lbl{font-size:13px;font-weight:500;color:var(--muted)}
.big{font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.unit{font-size:15px;font-weight:500;color:var(--muted)}

/* header */
.hd{display:flex;align-items:center;gap:14px;min-height:48px}
.hd-t{flex:1;text-align:center;font-size:16px;font-weight:600}
.hd-r,.hd-n{min-width:48px;text-align:right;font-size:14px;font-weight:500;color:var(--muted)}
.ib{flex:none;width:48px;height:48px;border-radius:24px;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.06);transition:transform .25s var(--spring)}
.ib:active{transform:scale(.9)}
.pb{flex:1;height:4px;border-radius:2px;background:#E2E2E6;overflow:hidden}
.pb i{display:block;height:100%;border-radius:2px;background:var(--blue);transition:width .7s var(--ease)}
.kd{flex:1;display:flex;gap:4px}
.kd i{flex:1;height:4px;border-radius:2px;background:#E2E2E6;transition:background .5s ease}
.kd i.on{background:var(--blue)}

/* buttons */
button{font-family:var(--f);letter-spacing:-.01em}
.btn{position:relative;overflow:hidden;flex:none;height:60px;border:none;border-radius:30px;background:var(--ink);color:#fff;font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .25s var(--spring),background .3s ease,opacity .3s ease}
.btn:active{transform:scale(.97)}
.btn.blue{background:var(--blue)}
.btn.light{background:var(--card);color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.05)}
.btn.ghost{background:var(--blue-soft);color:var(--blue);height:52px;font-size:16px;font-weight:700}
.btn.dis{opacity:.35;pointer-events:none}
.btn.ready{animation:readyPop .5s var(--spring)}
@keyframes readyPop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:none}}
.mt{margin-top:auto}
.lnk{align-self:center;border:none;background:none;padding:8px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;transition:color .2s ease}
.lnk:hover{color:var(--ink)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .65s ease-out forwards;pointer-events:none}
.btn.light .rip,.opt .rip{background:rgba(23,92,255,.12)}
@keyframes rip{to{transform:scale(1);opacity:0}}
.round{flex:none;width:64px;height:64px;border-radius:32px;border:none;background:var(--blue);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .3s var(--spring)}
.round:hover{transform:rotate(-8deg) scale(1.04)}
.round:active{transform:scale(.9)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

/* cards & media */
.card{background:var(--card);border-radius:24px;padding:16px 18px}
.soft{background:var(--soft);border-radius:20px;padding:14px 16px}
.media{position:relative;border-radius:28px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#E3E7EF 0%,#D7DDE7 100%);flex:none;display:flex;align-items:center;justify-content:center}
.frame{position:relative;flex:none;width:100%;height:100%}
.frame>img{width:100%;height:100%;object-fit:contain;display:block;transition:opacity .35s ease}
.screen.anim .frame{animation:settle 1.1s var(--ease) both}
@keyframes settle{from{opacity:.4;transform:scale(1.05)}}
.frame.breathe>img{transform-origin:50% 95%;animation:breathe 5.5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.014) translateY(-.4%)}}
.frame.squat>img{transform-origin:50% 92%;animation:squatLoop 2.6s ease-in-out infinite}
@keyframes squatLoop{0%,100%{transform:none}45%{transform:translateY(3%) scaleY(.965)}}
.frame.dip>img{transform-origin:50% 92%;animation:dipOnce .9s ease-in-out}
@keyframes dipOnce{45%{transform:translateY(3.5%) scaleY(.955)}}
.fx{position:absolute;inset:0;pointer-events:none}
.b3d-canvas{position:absolute;inset:0;width:100%!important;height:100%!important;z-index:1;animation:fadeIn .6s ease both}
.live3d>.frame{opacity:0;transition:opacity .4s ease}
.media>.chip{z-index:2}
.hs{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #175CFF,0 2px 8px rgba(0,0,0,.2);transition:box-shadow .4s ease,opacity .4s ease,transform .5s var(--spring)}
.hs::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #175CFF;animation:ping 2.2s ease-out infinite;animation-delay:var(--d,0s)}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(2.6);opacity:0}}
.hs.idle{box-shadow:0 0 0 3px #B9B9C0,0 2px 8px rgba(0,0,0,.15)}.hs.idle::after{border-color:#B9B9C0}
.hs.ok{box-shadow:0 0 0 3px #1E9E5A,0 2px 8px rgba(0,0,0,.2)}.hs.ok::after{border-color:#1E9E5A}
.hs.off{opacity:0;transform:scale(.3)}
.hs.click{animation:hsClick .6s var(--spring)}
@keyframes hsClick{0%{transform:scale(1.8)}100%{transform:none}}
.glow{position:absolute;width:var(--s,56px);height:var(--s,56px);margin:calc(var(--s,56px) / -2) 0 0 calc(var(--s,56px) / -2);border-radius:50%;background:radial-gradient(circle,rgba(70,130,255,.65) 0%,rgba(70,130,255,.18) 45%,rgba(70,130,255,0) 70%);animation:glowP 2.6s ease-in-out infinite;animation-delay:var(--d,0s);transition:opacity .45s ease,transform .45s var(--spring)}
@keyframes glowP{0%,100%{transform:scale(.8);opacity:.55}50%{transform:scale(1.15);opacity:1}}
.glow.off{opacity:0!important;transform:scale(.3)!important;animation:none}
.waves{position:absolute;width:0;height:0}
.waves i{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;border:2px solid rgba(23,92,255,.75);animation:wave 2.4s ease-out infinite}
.waves i:nth-child(2){animation-delay:.8s}.waves i:nth-child(3){animation-delay:1.6s}
.frame.loud .waves i{animation-duration:1.1s;border-width:2.5px}
@keyframes wave{from{transform:scale(.5);opacity:1}to{transform:scale(3.2);opacity:0}}
.sheen{position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.5) 50%,rgba(255,255,255,0) 65%);background-size:300% 100%;animation:sheen 3.8s ease-in-out infinite;mix-blend-mode:soft-light}
@keyframes sheen{from{background-position:120% 0}to{background-position:-20% 0}}
.fxsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.beam{stroke:#175CFF;stroke-width:2.2;stroke-dasharray:4 6;fill:none;animation:march 1s linear infinite;transition:stroke .4s ease}
.frame.ok .beam{stroke:#1E9E5A}
@keyframes march{to{stroke-dashoffset:-20}}
.draw{fill:none;stroke:#2E6BFF;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:drawLine 4.5s var(--ease) infinite;animation-delay:var(--d,0s)}
@keyframes drawLine{0%{stroke-dashoffset:1;opacity:1}35%{stroke-dashoffset:0;opacity:1}80%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.floorring{position:absolute;left:50%;width:46%;height:7%;margin-left:-23%;border-radius:50%;border:2px solid rgba(23,92,255,.8);box-shadow:0 0 14px rgba(23,92,255,.5);animation:floorP 2.4s ease-out infinite}
.floorring.r2{animation-delay:1.2s}
@keyframes floorP{from{transform:scale(.7);opacity:1}to{transform:scale(1.35);opacity:0}}
.chip{position:absolute;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:18px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:14px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.06);transition:background .4s ease,color .4s ease,transform .4s var(--spring)}
.chip i{width:8px;height:8px;border-radius:4px;background:var(--blue);transition:background .4s ease}
.chip.ok i{background:var(--green)}
.chip.warn{background:var(--amber-soft);color:var(--amber-ink);box-shadow:0 0 0 1.5px var(--amber)}
.chip.warn i{background:var(--amber)}
.chip.hot{background:var(--blue);color:#fff}
.chip.hot i{background:#fff}
.chip.pop{animation:chipPop .5s var(--spring)}
@keyframes chipPop{0%{transform:scale(.85)}60%{transform:scale(1.08)}}
.float{animation:float 5s ease-in-out infinite}
.float.d2{animation-delay:-2.5s}
@keyframes float{50%{transform:translateY(-6px)}}

/* option rows */
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:none;border-radius:22px;background:var(--card);color:var(--ink);text-align:left;cursor:pointer;box-shadow:inset 0 0 0 2px transparent,0 4px 12px rgba(0,0,0,.04);transition:box-shadow .3s ease,transform .25s var(--spring)}
.opt:active{transform:scale(.985)}
.opt.on{box-shadow:inset 0 0 0 2px var(--blue),0 6px 18px rgba(23,92,255,.1)}
.oi{flex:none;width:46px;height:46px;border-radius:23px;background:#EDEDF0;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:background .3s ease,color .3s ease,transform .4s var(--spring)}
.opt.on .oi{background:var(--blue);color:#fff;transform:rotate(-8deg)}
.ot{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.ot b{font-size:17px;font-weight:600}
.ot small{font-size:13px;color:var(--muted)}
.ck{flex:none;width:28px;height:28px;border-radius:14px;box-shadow:inset 0 0 0 2px #DADADF;display:flex;align-items:center;justify-content:center;transition:background .3s ease,box-shadow .3s ease}
.ck svg{transform:scale(0);transition:transform .35s var(--spring)}
.on .ck{background:var(--blue);box-shadow:none}
.on .ck svg{transform:scale(1)}
.ck.g{}
.on .ck.g{background:var(--green)}

/* pills */
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{border:none;padding:12px 18px;border-radius:22px;background:var(--card);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.04);transition:background .3s ease,color .3s ease,transform .3s var(--spring)}
.pill.on{background:var(--ink);color:#fff}
.pill:active{transform:scale(.92)}
.pill.b.on{background:var(--blue)}

/* segmented */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:24px;background:#E6E6EA;flex:none}
.seg .ind{position:absolute;top:4px;bottom:4px;left:4px;border-radius:20px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .45s var(--spring)}
.seg button{position:relative;z-index:1;height:40px;border:none;background:none;border-radius:20px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:color .3s ease}
.seg button.on{color:var(--ink)}
.panel{display:none;flex-direction:column;gap:12px}
.panel.on{display:flex;animation:panelIn .45s var(--ease)}
@keyframes panelIn{from{opacity:0;transform:translateX(12px)}}

/* switch */
.sw{flex:none;position:relative;width:52px;height:32px;border:none;border-radius:16px;background:#DADADF;cursor:pointer;transition:background .3s ease}
.sw i{position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .45s var(--spring),width .2s ease}
.sw:active i{width:32px}
.sw.on{background:var(--blue)}
.sw.on i{transform:translateX(20px)}
.sw.on:active i{transform:translateX(14px)}
.row{display:flex;align-items:center;gap:14px}

/* coach bubble */
.bub{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:24px;background:var(--card)}
.bub-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted)}
.bub-t{font-size:17px;font-weight:600;line-height:1.35;min-height:23px}
.dots{display:inline-flex;gap:4px;align-items:center;height:23px}
.dots i{width:7px;height:7px;border-radius:4px;background:#B9B9C0;animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.caret::after{content:"";display:inline-block;width:2px;height:1em;margin-left:2px;background:var(--blue);vertical-align:-2px;animation:caret .8s steps(2) infinite}
@keyframes caret{50%{opacity:0}}

/* bars */
.bars{display:flex;align-items:flex-end;gap:4px}
.bars span{flex:1;border-radius:2px;background:var(--ink);opacity:.28;transform-origin:bottom;animation:grow .8s var(--ease) both;animation-delay:calc(var(--j) * 35ms + 250ms)}
.bars span.hi{background:var(--blue);opacity:1}
.bars span.fut{opacity:.1}
@keyframes grow{from{transform:scaleY(0)}}

/* misc */
.bump{animation:bump .4s var(--spring)}
@keyframes bump{0%{transform:scale(.82)}60%{transform:scale(1.07)}100%{transform:none}}
.eq{display:inline-flex;gap:3px;align-items:center;height:18px}
.eq i{width:3px;height:16px;border-radius:2px;background:currentColor;animation:eq .8s ease-in-out infinite;animation-delay:var(--d)}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.radar{position:absolute;left:50%;top:50%;width:0;height:0}
.radar span{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:2px solid rgba(23,92,255,.6);animation:radar 2.4s ease-out infinite}
.radar span:nth-child(2){animation-delay:.8s}.radar span:nth-child(3){animation-delay:1.6s}
@keyframes radar{from{transform:scale(.4);opacity:1}to{transform:scale(2.4);opacity:0}}
.pulse{animation:pulseDot 1.6s ease-in-out infinite}
@keyframes pulseDot{50%{box-shadow:0 0 0 7px rgba(229,162,59,.12)}}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid #E6E6EA;border-top-color:var(--blue);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.dot{width:34px;height:34px;border-radius:17px;box-shadow:inset 0 0 0 2px #C9C9CF;display:flex;align-items:center;justify-content:center;transition:background .35s ease,box-shadow .35s ease}
.dot svg{transform:scale(0);transition:transform .4s var(--spring)}
.dot.on{background:var(--blue);box-shadow:none}
.dot.on svg{transform:scale(1)}
.burst{position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--blue);opacity:0;pointer-events:none}
.burst.go{animation:burst .7s ease-out}
@keyframes burst{from{transform:scale(.7);opacity:1}to{transform:scale(1.6);opacity:0}}
.ring circle.prog{transition:stroke-dashoffset 1s linear}
.list{display:flex;flex-direction:column;border-radius:22px;background:var(--card);padding:2px 18px}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);border-left:none;border-right:none;border-top:none;background:none;width:100%;text-align:left;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.li:last-child{border-bottom:none}
.li .grow{flex:1}
.li .v{font-size:14px;font-weight:500;color:var(--muted)}
.li:hover .chev{transform:translateX(3px)}
.chev{transition:transform .25s var(--ease)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;padding:14px 16px;border-radius:22px;background:var(--card)}
.stat .big{font-size:36px}
.fade-swap{transition:opacity .3s ease}
.fade-swap.out{opacity:0}

/* tab bar */

/* range */

    stand: {},
    squat: { spine:0.5, neck:-0.4, shLx:-1.4, shLz:0.22, shRx:-1.4, shRz:-0.22, elL:-1.75, elR:-1.75, hipLx:-1.62, hipRx:-1.62, hipLz:0.2, hipRz:-0.2, knL:2.2, knR:2.2, anL:-0.58, anR:-0.58, effort:1 },
    squatEasy: { spine:0.32, neck:-0.25, shLx:-1.35, shLz:0.2, shRx:-1.35, shRz:-0.2, elL:-1.6, elR:-1.6, hipLx:-0.95, hipRx:-0.95, hipLz:0.14, hipRz:-0.14, knL:1.35, knR:1.35, anL:-0.4, anR:-0.4, effort:0.6 },

  <div class="card st" style="display:flex;flex-direction:column;gap:12px;border-radius:28px"><div class="row" style="justify-content:space-between"><span class="lbl">Reps this week</span><span style="font-size:13px;font-weight:700;color:var(--blue)">Day 1</span></div><span class="big" style="font-size:52px" data-count="96">0</span>
    <div class="row" style="align-items:flex-end;gap:10px;height:110px">${['M','T','W','T','F','S','S'].map((d,i)=>`<div style="flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px"><span style="width:100%;height:${i===4?82:8}%;border-radius:6px;background:${i===4?'#175CFF':'rgba(18,18,20,.1)'};transform-origin:bottom;animation:grow .8s var(--ease) both;animation-delay:${0.3+i*0.05}s"></span><span class="small" style="font-size:12px;${i===4?'color:#175CFF;font-weight:700':''}">${d}</span></div>`).join('')}</div></div>
  <div class="grid2 st"><div class="stat" style="background:linear-gradient(180deg,#EAEAED,#FFFFFF)"><span class="small">Streak</span><span class="big" style="font-size:40px"><span data-count="1">0</span><span class="unit"> session</span></span><span class="small" style="font-size:12px">1 freeze left this week</span></div><div class="stat"><span class="small">Plan</span><span class="big" style="font-size:40px"><span data-count="1">0</span><span class="unit"> / ${st.days*4}</span></span><span class="small" style="font-size:12px">Week 1 of 4</span></div></div>

  act: { support: () => toast('Support chat opened') } };

/* ---------- engine ---------- */
const stage = $('#stage');
let hist = [], lock = false;
const DUR = 520;

function build(id, anim=true){
  const d = S[id], el = document.createElement('section');
  el.className = 'screen' + (d.modal ? ' modal' : '') + (d.cls ? ' ' + d.cls : '') + (d.tab !== undefined ? ' tabbed' : '') + (anim ? ' anim' : '');
  el.dataset.id = id; el.setAttribute('aria-label', id);
  el.innerHTML = d.render();
  $$('.st', el).forEach((n, i) => n.style.setProperty('--i', i));
  return el;
}
function mount(el, id){
  const d = S[id];
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$('[data-to]', el).forEach(i => i.style.width = i.dataset.to + '%');
    $$('[data-kd]', el).forEach(i => i.classList.add('on'));
    if (!d.noCount) $$('[data-count]', el).forEach(countUp);
  }));
  fitFrames(el);
  $$('[data-say]', el).forEach(s => later(() => say(s, s.dataset.say), 500));
  d.mount && d.mount(el);
}
function tabbar(id){
  const d = S[id], tb = $('#tabbar');
  tb.classList.toggle('show', d.tab !== undefined);
  if (d.tab !== undefined) { $('#tbind').style.transform = `translateX(${d.tab * 78.5}px)`; $$('#tabbar button').forEach((b, i) => b.classList.toggle('on', i === d.tab)); }
}
function go(id, mode='push'){
  if (lock || !S[id]) return; lock = true; setTimeout(() => lock = false, 380);
  clearTimers();
  const el = build(id, mode !== 'pop');
  if (S[id].modal) mode = 'up';
  const olds = [...stage.children];
  stage.appendChild(el);
  if (mode === 'up') { olds.forEach(o => o.setAttribute('inert','')); }
  else {
    el.classList.add('in-' + mode);
    olds.forEach(o => { o.classList.add('out-' + mode); o.setAttribute('inert',''); setTimeout(() => { o._dispose && o._dispose(); o.remove(); }, DUR); });
    setTimeout(() => el.classList.remove('in-' + mode), DUR + 20);
  }
  if (mode === 'tab' && hist.length) hist.pop();
  if (mode !== 'up') hist = hist.filter(h => !S[h.id].modal);
  hist.push({ id, mode });
  mount(el, id); tabbar(id);
  const j = $('#jump'); const stages = [...j.options].map(o => o.value); if (stages.includes(id)) j.value = id;
}
function back(){
  if (lock || hist.length < 2) return; lock = true; setTimeout(() => lock = false, 380);
  clearTimers();
  const cur = hist.pop(), prev = hist[hist.length - 1];
  if (cur.mode === 'up') {
    const top = stage.lastElementChild; top.classList.add('modal-out'); setTimeout(() => { top._dispose && top._dispose(); top.remove(); }, 360);
    const under = stage.children[stage.children.length - 2];
    if (under) { under.removeAttribute('inert'); S[prev.id].mount && S[prev.id].mount(under); }
    tabbar(prev.id); return;
  }
  const el = build(prev.id, false), olds = [...stage.children], m = cur.mode === 'push' ? 'pop' : 'fade';
  stage.appendChild(el); el.classList.add('in-' + m);
  olds.forEach(o => { o.classList.add('out-' + m); o.setAttribute('inert',''); setTimeout(() => { o._dispose && o._dispose(); o.remove(); }, DUR); });
  setTimeout(() => el.classList.remove('in-' + m), DUR + 20);
  mount(el, prev.id); tabbar(prev.id);
}

function tabTo(el, i, segEl){
  const sg = segEl || $('.seg', el); if (!sg) return;
  const bs = $$('button', sg); bs.forEach((b, k) => { b.classList.toggle('on', k === i); b.setAttribute('aria-selected', k === i); });
  $('.ind', sg).style.transform = `translateX(calc(${i} * (100% + 4px)))`;
  $$('.panel', el).forEach(p => p.classList.toggle('on', +p.dataset.panel === i));
  el._tab = i; fitFrames(el);
  const d = S[el.dataset.id]; d.onTab && d.onTab(el, i);
}
function setKey(path, val){ const ks = path.split('.'); let o = st; while (ks.length > 1) o = o[ks.shift()]; o[ks[0]] = val; }
function getKey(path){ return path.split('.').reduce((o, k) => o[k], st); }

/* ripple */
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.btn,.opt'); if (!b || RM) return;
  const r = b.getBoundingClientRect(), scale = r.width / b.offsetWidth || 1, size = Math.max(b.offsetWidth, b.offsetHeight) * 2.2;
  const s = document.createElement('span'); s.className = 'rip'; s.style.width = s.style.height = size + 'px';
  s.style.left = ((e.clientX - r.left) / scale - size / 2) + 'px'; s.style.top = ((e.clientY - r.top) / scale - size / 2) + 'px';
  b.appendChild(s); setTimeout(() => s.remove(), 700);
});

$('#app').addEventListener('click', e => {
  const scr = e.target.closest('.screen'); const id = scr && scr.dataset.id; const d = id && S[id];
  const act = e.target.closest('[data-act]');
  if (act && d) {
    const a = act.dataset.act;
    if (d.act && d.act[a]) { if (a === 'sample') e.stopPropagation(); d.act[a](act, scr, e); return; }
    if (a === 'pick') { const g = act.dataset.group, raw = act.dataset.val, v = isNaN(+raw) ? raw : +raw; $$(`[data-group="${g}"]`, scr).forEach(x => { x.classList.toggle('on', x === act); x.setAttribute('aria-pressed', x === act); }); st[g] = v; d.on && d.on[g] && d.on[g](v, scr, act); return; }
    if (a === 'toggle' || a === 'switch') { const k = act.dataset.key, v = !getKey(k); setKey(k, v); act.classList.toggle('on', v); act.setAttribute(a === 'switch' ? 'aria-checked' : 'aria-pressed', v); const root = k.split('.')[0]; d.on && d.on[root] && d.on[root](v, scr, act); return; }
    if (a === 'tab') { tabTo(scr, +act.dataset.i, act.closest('.seg')); return; }
    if (a === 'obnext') { go(nextOb(act.dataset.from)); return; }
  }
  const g = e.target.closest('[data-go]'); if (g && scr && g !== scr) { go(g.dataset.go, g.dataset.mode || 'push'); return; }
  if (scr && scr.dataset.go && e.target.closest('.splash')) { go(scr.dataset.go, scr.dataset.mode); return; }
  if (e.target.closest('[data-back]')) { back(); return; }
});
$('#app').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"]')) { e.preventDefault(); e.target.click(); } });
$('#app').addEventListener('input', e => { const t = e.target.closest('[data-act-input]'); if (!t) return; const scr = t.closest('.screen'), d = S[scr.dataset.id]; d.input && d.input[t.dataset.actInput] && d.input[t.dataset.actInput](t, scr); });
$$('#tabbar button').forEach((b, i) => { b.innerHTML = svg(['home','pod','cal','gear'][i]); b.addEventListener('click', () => { const cur = hist[hist.length-1]; if (cur && cur.id !== b.dataset.tab) go(b.dataset.tab, 'tab'); }); });

$('#jump').addEventListener('change', e => { hist = []; [...stage.children].forEach(c => c._dispose && c._dispose()); stage.innerHTML = ''; go(e.target.value, 'fade'); });
$('#restart').addEventListener('click', () => { st = fresh(); hist = []; [...stage.children].forEach(c => c._dispose && c._dispose()); stage.innerHTML = ''; $('#jump').value = 'splash'; go('splash', 'fade'); });

/* fit device to window */
function fit(){
  const area = $('#fit'), sc = $('#scaler'), dv = $('#device');
  const s = Math.min(1, (area.clientHeight - 4) / 864, (area.clientWidth) / 410);
  dv.style.transform = `scale(${s})`; sc.style.width = (410 * s) + 'px'; sc.style.height = (864 * s) + 'px';
}
window.addEventListener('resize', fit); fit();
if (window.ResizeObserver) new ResizeObserver(() => { const top = stage.lastElementChild; if (top) fitFrames(top); }).observe(stage);
go('splash', 'fade');
})();
</script>
